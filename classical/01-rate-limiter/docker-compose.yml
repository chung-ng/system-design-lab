services:
  redis:
    image: redis:7-alpine
    container_name: rate_limiter_redis
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
